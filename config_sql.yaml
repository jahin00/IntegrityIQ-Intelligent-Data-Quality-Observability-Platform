sql:
  required_columns:
    orders:
      - transaction_id
      - customer_id
      - transaction_date
      - region
      - quantity
      - unit_price
      - actual_total
  value_rules:
    orders:
      quantity:
        min: 1
        max: 1000
      unit_price:
        min: 0
      discount:
        min: 0
        max: 1
      actual_total:
        min: 0
  primary_keys:
    orders: transaction_id
    customers: customer_id
  foreign_keys:
    - child_table: orders
      child_key: customer_id
      parent_table: customers
      parent_key: customer_id
  reconciliation:
    - table: orders
      expected_column: expected_total
      actual_column: actual_total
      tolerance: 0.01
